services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-planoteca}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    # O Farol não tem healthcheck e a API sobe antes do banco aceitar conexão.
    # Aqui o `depends_on` espera de verdade: sem isto a primeira migration na
    # subida limpa falha por "connection refused" e o container sai com erro.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-planoteca}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Local
      - ConnectionStrings__DefaultConnection=Host=db;Port=5432;Database=${POSTGRES_DB:-planoteca};Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD}
    ports:
      - "5000:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pg_data:
